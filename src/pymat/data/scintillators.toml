# ============================================================================
# LSO:Ce — Cerium-doped lutetium oxyorthosilicate (#116)
# ============================================================================
# Sibling of `lyso` (LYSO is Y-co-doped LSO). LSO:Ce is the original
# 1992 Melcher & Schweitzer scintillator (DOI 10.1109/23.159655).
# That paper reports density 7.4 g/cc and a two-component decay
# (12 ns at 30%, 42 ns at 70%). Light yield "75% of NaI(Tl)" in the
# abstract is a relative figure — not transcribed as a scalar. The
# emission peak (~420 nm) is widely cited but only loosely worded in
# the 1992 abstract; omitted here pending a tighter primary citation.

[lso]
name = "LSO"
formula = "Lu2SiO5"

[lso.Ce]
name = "LSO:Ce"
formula = "Lu2SiO5:Ce"

[lso.Ce.mechanical]
density_value = 7.4
density_unit = "g/cm^3"

[lso.Ce.optical]
decay_time = 42
hygroscopic = false
# Intrinsic (non-statistical) energy resolution, FWHM %, at the 662 keV 137Cs
# photopeak. READ THE SOURCE NOTE BEFORE COMPARING THIS TO YOUR OWN NUMBER.
# R_int is not measured — it is what REMAINS after an assumed photostatistical
# term is subtracted in quadrature, so it inherits whatever the authors assumed
# for light collection. Two labs can report different R_int for the same
# crystal purely by using different photodetectors.
intrinsic_resolution_pct_at_662keV = { nominal = 7.7, stddev = 1.0 }
# Photon non-proportionality: LSO:Ce retains ~57% of its 662 keV light yield at
# 10 keV, i.e. ~43% down. This is the physical cause of R_int.
non_proportionality = 43.0
decay_components = [
    { tau_ns = 12.0, fraction = 0.30 },
    { tau_ns = 42.0, fraction = 0.70 },
]

[lso.Ce._sources]
"optical.intrinsic_resolution_pct_at_662keV" = { citation = "chewpraditkul_moszynski_2011", kind = "doi", ref = "10.1016/j.phpro.2011.11.035", license = "proprietary-reference-only", note = "Chewpraditkul & Moszynski, Phys. Procedia 22, 218-226 (2011). LSO:Ce 10x10x5 mm, Crytur, XP5500B PMT. EXTRACTION METHOD, from which the value is inseparable: measured total dE/E = 8.3 +/- 0.3% at 662 keV with N_pe = 6610 photoelectrons; statistical term 2.355*sqrt(1+eps)/sqrt(N_pe) with PMT variance eps = 0.1 gives 3.0%; transfer term assumed zero; the 7.7% residual is attributed to the scintillator. Reproduced from those inputs as 7.72%. THE STDDEV OF 1.0 IS NOT THE PAPER ERROR BAR - the paper quotes +/-0.3 on the TOTAL, not the residual. It is an honest widening for two effects the paper cannot capture: extraction-assumption sensitivity (a different photodetector changes N_pe, hence the statistical term, hence the residual), and sample-to-sample spread, for which Khodyuk & Dorenbos 2012 Table I gives published LSO:Ce total resolution spanning 7.9-11.9% across five references. Paper is open access under CC BY-NC-ND; recorded as proprietary-reference-only because NC-ND is not in this repo redistributable set, so the number is cited rather than the table reproduced." }
"optical.non_proportionality" = { citation = "khodyuk_dorenbos_2012", kind = "doi", ref = "10.1109/TNS.2012.2221094", license = "proprietary-reference-only", note = "Khodyuk & Dorenbos, IEEE TNS 59 (2012), Table I: LSO:Ce photon non-proportional response at 10 keV is 56.7% of the 662 keV yield, i.e. 43% down; sigma_photon-nPR = 8.40%. Open-access preprint arXiv:1204.4350. The highest-precision underlying electron-response measurement is Khodyuk, de Haas & Dorenbos, doi:10.1109/TNS.2011.2175214 (preprint arXiv:1101.4485), resolving 9-100 keV in 25 eV steps plus K-dip spectroscopy to ~100 eV - but that exists only as figures, so no table is reproduced here." }

[lso.Ce._absent]
"optical.intrinsic_resolution_pct_at_511keV" = { reason = "not-measured", note = "NO PRIMARY SOURCE REPORTS AN EXTRACTED INTRINSIC RESOLUTION AT 511 keV for LSO:Ce or LYSO:Ce. Extraction is conventionally done at the 662 keV 137Cs photopeak, where the statistical term is smallest and the subtraction most stable. R_int IS energy-dependent - it falls from roughly 15-20% near 16.6 keV to ~7.7% at 662 keV, driven by non-proportionality - so a 511 keV value is not simply the 662 keV one. It can only be read off published curves (Chewpraditkul 2011 Fig. 3; Wanarak et al. 2012 Fig. 3, doi:10.1016/j.proeng.2012.02.010), which are figures behind a paywall, not tables. Reading a value off such a figure would produce a number with the appearance of a citation and none of the substance. Interpolation suggests roughly 7.5-8.5% for LSO:Ce; that is an inference, and it is recorded in this note rather than in the field." }


