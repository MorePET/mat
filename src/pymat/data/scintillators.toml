"optical.refractive_index" = { citation = "luxium_prelude420", kind = "vendor", ref = "https://luxiumsolutions.com/sites/default/files/2021-08/LYSO-Material-Data-Sheet.pdf", license = "proprietary-reference-only", note = "1.81 at the 420 nm emission peak — the vendor's own figure, slightly below the 1.82 generic scalar on the parent." }

