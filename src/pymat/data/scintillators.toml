emission_peak = 480
emission_range = [375, 650]
hygroscopic = false
# DO NOT hand-author `refractive_index_dispersion` here — `bgo` is inside the
# enricher's scope; see the header of this file and ADR-0004 §10.
#
# The data exists and is CC0: Williams et al., Appl. Opt. 35, 3562-3569 (1996),
# doi:10.1364/AO.35.003562, Sellmeier n^2 - 1 = 3.1218393*L^2/(L^2 - 0.1807^2)
# for L in um over 0.305-1.0 um, republished by refractiveindex.info under CC0.
# It gives n = 2.177 at 420 nm and 2.080 at the 480 nm emission peak — note
# that the 2.15 scalar above sits between them, so a monochromatic-at-peak
# simulation using it is off by ~3% in n at the peak.
#
# THE ACTION IS TO RUN THE ENRICHER, not to type the numbers:
#     python scripts/enrich_from_refractiveindex.py --key bgo --dry-run
#     python scripts/enrich_from_refractiveindex.py --key bgo --write

