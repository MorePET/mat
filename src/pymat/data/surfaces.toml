lut_surface = "polishedlumirrorair"
reflector = "Lumirror (Toray biaxially-oriented white PET)"
coupling = "air_gap"
note = "Lumirror is a Toray voided/pigmented polyester film and reflects diffusely. It is NOT 3M ESR — see the vm2000 entries for the specular multilayer."

