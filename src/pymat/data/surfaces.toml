# ============================================================================
# surfaces.toml — measured optical surface finishes (#243, ADR-0004)
# ============================================================================
#
# A surface here is an INTERFACE, not a bulk. Each entry describes a measured
# crystal-face / reflector / coupling triple: what treatment the face had, what
# reflector sat against it, and what filled the gap between them.
#
# Scope is deliberately narrow — MEASURED interfaces only. Every entry below
# comes from the Geant4 `G4RealSurface` 2.2 data set: 21 LBNL look-up tables
# (Janecek & Moses 2010) and 9 DAVIS look-up tables (Roncali & Cherry 2013).
#
# NOT here, on purpose:
#
#   * Geant4's six analytic UNIFIED/GLISUR finishes — `polished`, `ground`,
#     `polishedfrontpainted`, `polishedbackpainted`, `groundfrontpainted`,
#     `groundbackpainted`. These ship no data file. They are model selections
#     parameterised by a fitted `sigma_alpha`, so they are run-time policy for
#     the consuming engine, not measurements (ADR-0004 §3).
#   * The three bare-surface LBNL enum members `polishedair`, `etchedair` and
#     `groundair`. They ARE `dielectric_LUT` enum values, but `ReadLUTFile()`
#     finds no `.dat` for them — there is no measurement behind the name. They
#     are named here in this comment so the omission is greppable rather than
#     silent. (24 LBNL LUT enum members - 3 unmeasured = the 21 below.)
#   * Assignments. Which face of which crystal carries which finish is a fact
#     about a built detector, not about matter.
#
# `lut_surface` is the exact `G4OpticalSurfaceFinish` enum spelling, transcribed
# verbatim from `source/materials/include/G4OpticalSurface.hh`. The casing is
# inconsistent between families (`polishedvm2000glue` vs `PolishedESRGrease_LUT`)
# because Geant4's is. Do not normalise it — downstream consumers match on it.
#
# `coupling` vocabulary:
#   air_gap          — a reflector is present, with air between it and the face.
#                      The photon meets a crystal->air Fresnel step first: large
#                      index contrast, small critical angle, strong TIR
#                      light-piping. This is the mechanism DOI designs exploit.
#   optical_contact  — the gap is index-filled (grease, glue, meltmount). The
#                      photon meets the polymer directly. `coupling_index` is
#                      then required: the index of the filler is the entire
#                      physical difference between the two cases.
#   none             — no reflector at all; a bare face against the ambient.
#
# Note (Kang et al., NIM A 2017, doi:10.1016/j.nima.2017.02.032): 3M ESR is a
# multilayer interference stack designed for an air interface, so wet-coupling
# it measurably lowers its effective reflectivity. That is a second, independent
# reason the `*_air` and `*_glue`/`*Grease` variants are separate measurements
# and must not be treated as one surface with a different gap material.

# ============================================================================
# LBNL / Janecek look-up tables — 21 measured surfaces
# ============================================================================
# 3 face treatments x 7 wrappings. Measured at LBNL on a 2-pi silicon
# photodiode array; the family citation and data-set identity live on this
# abstract parent and flow down to all 21 children.

[surface.lbnl]
abstract = true
model = "lut"
lut_family = "lbnl"
g4_surface_type = "dielectric_LUT"
lut_dataset = "G4RealSurface-2.2"

[surface.lbnl._sources]
_default = { citation = "geant4_realsurface_2_2", kind = "handbook", ref = "Geant4 G4RealSurface 2.2 data set; https://cern.ch/geant4-data/datasets/G4RealSurface.2.2.tar.gz", license = "Geant4-SL", note = "Enum spellings transcribed from source/materials/include/G4OpticalSurface.hh. Data set located at runtime via $G4REALSURFACEDATA." }
lut_surface = { citation = "geant4_optical_surface_hh", kind = "handbook", ref = "Geant4 source/materials/include/G4OpticalSurface.hh, G4OpticalSurfaceFinish enum", license = "Geant4-SL", note = "Verbatim enum spelling; stable across Geant4 10.3-11.1.3." }
coupling_index = { citation = "cargille_meltmount_1582", kind = "vendor", ref = "https://www.cargille.com/ — Cargille Meltmount, n_D = 1.582 (code 5870)", license = "proprietary-reference-only", note = "Meltmount is the removable thermoplastic mountant used for the LBNL glue-coupled reflectance measurements (see Janecek's reflectance-apparatus report, OSTI 952861); it lets the same crystal be re-wrapped with different reflectors. CAVEAT: 1.582 is the standard grade, but the LBNL papers do not tabulate the grade per measured surface, and Cargille also sells 1.539 and 1.605. Treat as the family value, not a per-surface measurement." }
lut_family = { citation = "janecek_moses_2010", kind = "doi", ref = "10.1109/TNS.2010.2042731", license = "proprietary-reference-only", note = "M. Janecek, W.W. Moses, 'Simulating Scintillator Light Collection Using Measured Optical Reflectance', IEEE TNS 57(3) 964-970 (2010). Cited, not redistributed." }

[surface.lbnl._absent]
reflectivity = { reason = "not-applicable", note = "A LUT entry IS the angular reflectance distribution. Collapsing it to a scalar reflectivity would discard the angular dependence that is the entire reason the table was measured." }

