# ============================================================================
# DAVIS look-up tables — 9 measured surfaces
# ============================================================================
# Built from AFM-scanned crystal topography convolved with Fresnel physics on
# each micro-facet, rather than from a goniometer sweep. Different method,
# different family, same catalogue shape.

[surface.davis]
abstract = true
model = "lut"
lut_family = "davis"
g4_surface_type = "dielectric_LUTDAVIS"
lut_dataset = "G4RealSurface-2.2"

[surface.davis._sources]
_default = { citation = "geant4_realsurface_2_2", kind = "handbook", ref = "Geant4 G4RealSurface 2.2 data set; https://cern.ch/geant4-data/datasets/G4RealSurface.2.2.tar.gz", license = "Geant4-SL", note = "Enum spellings transcribed from source/materials/include/G4OpticalSurface.hh; files read by ReadLUTDAVISFile()." }
lut_surface = { citation = "geant4_optical_surface_hh", kind = "handbook", ref = "Geant4 source/materials/include/G4OpticalSurface.hh, G4OpticalSurfaceFinish enum", license = "Geant4-SL", note = "Verbatim enum spelling; each maps to <name>.dat in the data set." }
coupling_index = { citation = "saint_gobain_bc630", kind = "vendor", ref = "Saint-Gobain / Luxium BC-630 silicone optical grease datasheet, n = 1.465", license = "proprietary-reference-only", note = "BC-630 is the grease used for the DAVIS ESR-grease measurements. Transmittance >= 95% down to 280 nm. Also present in this database as the material `bc630`." }
lut_family = { citation = "roncali_cherry_2013", kind = "doi", ref = "10.1088/0031-9155/58/7/2185", license = "proprietary-reference-only", note = "E. Roncali, S.R. Cherry, 'Simulation of light transport in scintillators based on 3D characterization of crystal surfaces', Phys. Med. Biol. 58(7) 2185-2198 (2013). The DAVIS reflectance model itself." }
treatment = { citation = "roncali_stockhoff_cherry_2017", kind = "doi", ref = "10.1088/1361-6560/aa6ca5", license = "proprietary-reference-only", note = "'An integrated model of scintillator-reflector properties for advanced simulations of optical transport' — the work that produced the 9 DAVIS LUTs." }
g4_surface_type = { citation = "stockhoff_2017", kind = "doi", ref = "10.1088/1361-6560/aa7007", license = "proprietary-reference-only", note = "Stockhoff, Jan, Dubois, Cherry, Roncali, 'Advanced optical simulation of scintillation detectors in GATE V8.0', Phys. Med. Biol. 62(12) L1-L8 (2017). The Geant4/GATE integration that added dielectric_LUTDAVIS." }

[surface.davis._absent]
reflectivity = { reason = "not-applicable", note = "The LUT is the reflectance distribution; a scalar would discard its angular dependence." }

