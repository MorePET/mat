name: Release

# Triggered by tags pushed by release-please (release-please.yml).
# Builds the wheel + sdist and publishes to PyPI via trusted publishing (OIDC).
# The GitHub Release itself is created by release-please — do not duplicate it
# here.

on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  # Retry path: re-running a failed tag run replays the workflow file as it was
  # at that tag, so a fix here only takes effect on a fresh run. Refs a
  # dispatch may publish from are constrained by the `pypi` environment's
  # deployment branch policy (`main` + `v*`), not by this trigger.
  workflow_dispatch:

permissions:
  contents: read

# Serialize PyPI publishes with publish-mcp.yml so concurrent tags
# don't queue against the same ``pypi`` GitHub environment.
concurrency:
  group: pypi-publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
